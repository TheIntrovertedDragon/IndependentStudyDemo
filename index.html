<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independent Study Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container-grid">
    <h1 style="grid-row: 1; grid-column: 1 / span 3; font-family: Georgia, 'Times New Roman', Times, serif;">Animations:</h1>

    <div class="redyellow" style="grid-row:2; grid-column: 1;"></div>

    <div class="greenblue" style="grid-row:2; grid-column: 2;"></div>

    <div class="spinsquare" style="grid-row: 2; grid-column: 3;"></div>

    <div class="coolspinsquare" style="grid-row: 3; grid-column: 1;"></div>

    <div class="sliding" style="grid-row: 3; grid-column: 2 / span 2;"></div>
    
    <p style="grid-row: 4; grid-column: 1 / span 3; font-family: Georgia, 'Times New Roman', Times, serif;">I will find ways to use these animations in my final project! yay</p>
  </div>  
  
</body>
</html>
