<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independent Study Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container-grid">
    <h1 style="grid-row: 1; grid-column: 1 / span 3; font-family: Georgia, 'Times New Roman', Times, serif;">Animations:</h1>

    <div class="greenblue" style="grid-row:2; grid-column: 2;"></div>

  </div>  
  
</body>
